<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      @keyframes gradientShift {
        0%, 100% {
          stop-color: #059669;
        }
        50% {
          stop-color: #10b981;
        }
      }
      
      @keyframes pulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.85;
        }
      }
      
      @keyframes rotate {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      
      .badge {
        animation: pulse 2s ease-in-out infinite;
      }
      
      .glow-ring {
        animation: rotate 4s linear infinite;
      }
      
      stop1 {
        animation: gradientShift 3s ease-in-out infinite;
      }
    </style>
    
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Glow ring background -->
  <circle class="glow-ring" cx="32" cy="32" r="30" fill="none" stroke="#d1fae5" stroke-width="2" opacity="0.4"/>
  
  <!-- Main badge -->
  <rect class="badge" x="8" y="8" width="48" height="48" rx="8" fill="url(#grad1)" />
  
  <!-- Border glow -->
  <rect x="8" y="8" width="48" height="48" rx="8" fill="none" stroke="#34d399" stroke-width="1" opacity="0.6"/>
  
  <!-- Letter E -->
  <text x="32" y="42" font-size="36" font-weight="bold" font-family="Arial, sans-serif" text-anchor="middle" fill="white" letter-spacing="-2">EA</text>
</svg>